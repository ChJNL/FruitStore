<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리동네 과일가게 - 경영 게임</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 상단 자산/날짜/조작 바 -->
  <header class="topbar">
    <h1 class="shop-sign">🍎🍌🍊 우리동네 과일가게</h1>

    <div class="stat-group">
      <div class="stat-box">
        <span class="stat-label">Day</span>
        <span id="dayDisplay" class="stat-value">1</span>
      </div>
      <div class="stat-box money-box">
        <span class="stat-label">소지금</span>
        <span id="moneyDisplay" class="stat-value">100,000원</span>
      </div>
    </div>

    <div class="control-group">
      <button id="startBtn" class="btn btn-start">🔔 영업 시작</button>
      <button id="nextDayBtn" class="btn btn-nextday">🌙 다음 날로 (정산)</button>
      <button id="resetBtn" class="btn btn-reset">♻️ 게임 리셋</button>
    </div>
  </header>

  <!-- 메인 3분할 레이아웃 -->
  <main class="game-layout">

    <!-- 좌측: 도매 시장 -->
    <section class="panel market-panel">
      <h2 class="panel-title">🚚 도매 시장</h2>
      <p class="panel-desc">신선한 과일을 저렴한 도매가로 들여오세요.</p>
      <div id="marketList" class="card-list"></div>
    </section>

    <!-- 중앙: 진열대 -->
    <section class="panel shelf-panel">
      <h2 class="panel-title">🏪 진열대</h2>
      <p class="panel-desc">창고 재고를 진열하고 판매 가격을 정하세요.</p>
      <div id="shelfList" class="card-list"></div>
    </section>

    <!-- 우측: 판매 로그 & 정산 -->
    <section class="panel log-panel">
      <h2 class="panel-title">🧾 오늘의 장부</h2>
      <div class="today-summary">
        <div class="summary-item">
          <span class="summary-label">방문 손님</span>
          <span id="visitorCount" class="summary-value">0명</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">판매 개수</span>
          <span id="soldCount" class="summary-value">0개</span>
        </div>
        <div class="summary-item">
          <span class="summary-label">오늘 매출</span>
          <span id="revenueCount" class="summary-value">0원</span>
        </div>
      </div>
      <div id="salesLog" class="sales-log"></div>
    </section>

  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="script.js"></script>
</body>
</html>
